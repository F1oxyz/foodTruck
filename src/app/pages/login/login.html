<section class="min-h-screen flex items-center justify-center p-6 bg-white relative overflow-hidden">
  

  <!-- Main Login Card -->
  <article class="relative w-full max-w-md bg-white/80 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-white/50">
    
    <!-- Hero / Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-3xl bg-amber-100 text-amber-500 mb-4 shadow-sm group hover:-translate-y-1 transition-transform cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
      </div>
      <h2 class="text-3xl font-black text-gray-900 tracking-tight">FoodTruck 🍔</h2>
      <p class="text-gray-400 text-sm mt-2 font-medium">Ingresá tus credenciales para hacer tu pedido</p>
    </div>

    <!-- Login Form -->
    <form class="flex flex-col gap-6">
      
      <!-- Input Group: Email -->
      <div class="flex flex-col gap-2">
        <label for="email" class="text-[10px] font-bold uppercase tracking-[0.2em] text-amber-500 ml-1">
          Correo Electrónico
        </label>
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400 group-focus-within:text-amber-500 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="16" x="2" y="4" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
          </div>
          <input 
            type="email" 
            id="email" 
            name="email"
            class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-transparent focus:border-amber-500 focus:bg-white rounded-2xl text-gray-900 text-sm outline-none transition-all duration-300 placeholder:text-gray-400 focus:shadow-sm" 
            placeholder="tumail@ejemplo.com"
            required
            autocomplete="email"
          >
        </div>
      </div>

      <!-- Input Group: Password -->
      <div class="flex flex-col gap-2">
        <div class="flex justify-between items-center ml-1">
          <label for="password" class="text-[10px] font-bold uppercase tracking-[0.2em] text-amber-500">
            Contraseña
          </label>
          <!-- <a href="#" class="text-xs text-gray-400 hover:text-amber-600 font-medium transition-colors">¿Olvidaste la clave?</a> -->
        </div>
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400 group-focus-within:text-amber-500 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <input 
            type="password" 
            id="password" 
            name="password"
            class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-transparent focus:border-amber-500 focus:bg-white rounded-2xl text-gray-900 text-sm outline-none transition-all duration-300 placeholder:text-gray-400 focus:shadow-sm" 
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>
      </div>

      <!-- Submit Button -->
      <!-- Usa la misma estética del botón "Agregar" en card_food -->
      <button 
        type="submit"
        class="group relative w-full flex justify-center items-center gap-2 bg-gray-900 hover:bg-amber-500 text-white font-bold tracking-widest uppercase py-4 rounded-2xl transition-all duration-300 active:scale-95 mt-2 overflow-hidden shadow-md"
      >
        <span class="relative z-10 flex items-center gap-2 text-sm">
          Ingresar
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 transition-transform duration-300 group-hover:translate-x-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </span>
      </button>

    </form>

    <!-- Footer Register -->
    <!-- <div class="mt-8 text-center flex flex-col items-center">
      <div class="w-full h-px bg-gray-100 mb-6"></div>
      <p class="text-sm text-gray-500 font-medium">
        ¿Te falta cuenta, pibe? 
        <a href="#" class="text-amber-500 font-bold hover:text-amber-600 hover:underline transition-all">Registrate acá</a>
      </p>
    </div> -->

  </article>
</section>
